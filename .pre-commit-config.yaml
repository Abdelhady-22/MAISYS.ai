repos:
  # ─────────────────────────────────────────────────────────────
  # Standard hygiene
  # ─────────────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=500']           # reject any file > 500 KB (data should be in cloud)
      - id: detect-private-key
      - id: mixed-line-ending

  # ─────────────────────────────────────────────────────────────
  # Python — format
  # ─────────────────────────────────────────────────────────────
  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        language_version: python3.11
        args: ['--line-length=100']

  # ─────────────────────────────────────────────────────────────
  # Python — lint
  # ─────────────────────────────────────────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.0
    hooks:
      - id: ruff
        args: ['--fix', '--exit-non-zero-on-fix']

  # ─────────────────────────────────────────────────────────────
  # Python — type check
  # ─────────────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        additional_dependencies:
          - types-requests
          - types-PyYAML
          - pydantic
        args: ['--ignore-missing-imports', '--strict']

  # ─────────────────────────────────────────────────────────────
  # Secret scanning — reject high-entropy strings
  # ─────────────────────────────────────────────────────────────
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: '\.lock$|package-lock\.json$'

  # ─────────────────────────────────────────────────────────────
  # Custom: reject data file extensions even if they pass size check
  # ─────────────────────────────────────────────────────────────
  - repo: local
    hooks:
      - id: no-data-files
        name: Reject data files in repo
        entry: bash -c 'shopt -s nullglob; for f in "$@"; do case "$f" in *.pdf|*.csv|*.tsv|*.jsonl|*.parquet|*.db|*.sqlite|*.sqlite3|*.h5|*.npy|*.safetensors|*.bin|*.pt|*.pth|*.ckpt) echo "ERROR: data file rejected: $f (data lives in cloud, not repo)"; exit 1;; esac; done' --
        language: system
        types: [file]

      - id: no-task-id-in-commit
        name: Reject task IDs in commit subject
        entry: bash -c 'msg=$(head -n1 "$1"); if echo "$msg" | grep -qE "(P[0-9]+-T[0-9]+|Phase\s+[0-9])"; then echo "ERROR: commit subject contains a task ID or phase reference. Use Conventional Commits without task IDs."; exit 1; fi'
        language: system
        stages: [commit-msg]

      - id: conventional-commit
        name: Enforce Conventional Commits format
        entry: bash -c 'msg=$(head -n1 "$1"); if ! echo "$msg" | grep -qE "^(feat|fix|chore|docs|refactor|test|build|ci|perf|style|revert)(\([a-z0-9-]+\))?: .{1,72}$"; then echo "ERROR: commit subject must follow Conventional Commits: <type>(<scope>): <subject>"; exit 1; fi'
        language: system
        stages: [commit-msg]

      - id: no-coauthor-trailer
        name: Reject Co-Authored-By trailers
        entry: bash -c 'if grep -qiE "(Co-Authored-By|Generated[- ]with|🤖|Generated by Claude)" "$1"; then echo "ERROR: commit message contains co-authoring trailer or AI attribution. Remove it."; exit 1; fi'
        language: system
        stages: [commit-msg]

# Run all hooks on every push to make CI failure less likely
default_stages: [pre-commit, pre-push, commit-msg]
