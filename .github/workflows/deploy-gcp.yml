# ─────────────────────────────────────────────────────────────────
# deploy-gcp.yml
#
# Triggered on push to dev branch.
# Builds containers, pushes to GCP Artifact Registry, applies k8s manifests
# to GKE dev cluster via Kustomize.
# ─────────────────────────────────────────────────────────────────
name: deploy-gcp

on:
  push:
    branches:
      - dev

concurrency:
  group: deploy-gcp
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: maisys-dev
  GCP_REGION: us-central1
  GKE_CLUSTER: maisys-dev
  GAR_REGISTRY: us-central1-docker.pkg.dev/maisys-dev/maisys

jobs:
  # ════════════════════════════════════════════════════════════════
  # Detect which services changed (skip rebuilds for unchanged ones)
  # ════════════════════════════════════════════════════════════════
  detect-changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.changes.outputs.services }}
      frontend: ${{ steps.changes.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - id: changes
        run: |
          changed_services=$(git diff --name-only HEAD^ HEAD | grep -oE 'services/[^/]+' | sort -u | sed 's|services/||' | jq -R -s -c 'split("\n")[:-1]')
          echo "services=$changed_services" >> "$GITHUB_OUTPUT"

          if git diff --name-only HEAD^ HEAD | grep -q '^frontend/'; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
          fi

  # ════════════════════════════════════════════════════════════════
  # Build and push service containers
  # ════════════════════════════════════════════════════════════════
  build-services:
    name: Build ${{ matrix.service }}
    needs: detect-changes
    if: needs.detect-changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.services) }}
      fail-fast: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Auth to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          push: true
          tags: |
            ${{ env.GAR_REGISTRY }}/${{ matrix.service }}:${{ github.sha }}
            ${{ env.GAR_REGISTRY }}/${{ matrix.service }}:latest
          cache-from: type=registry,ref=${{ env.GAR_REGISTRY }}/${{ matrix.service }}:cache
          cache-to: type=registry,ref=${{ env.GAR_REGISTRY }}/${{ matrix.service }}:cache,mode=max

  # ════════════════════════════════════════════════════════════════
  # Build and push frontend
  # ════════════════════════════════════════════════════════════════
  build-frontend:
    name: Build frontend
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: |
            ${{ env.GAR_REGISTRY }}/frontend:${{ github.sha }}
            ${{ env.GAR_REGISTRY }}/frontend:latest

  # ════════════════════════════════════════════════════════════════
  # Apply Kubernetes manifests via Kustomize
  # ════════════════════════════════════════════════════════════════
  deploy-k8s:
    name: Deploy to GKE
    needs: [build-services, build-frontend]
    if: |
      always() &&
      (needs.build-services.result == 'success' || needs.build-services.result == 'skipped') &&
      (needs.build-frontend.result == 'success' || needs.build-frontend.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: 'gke-gcloud-auth-plugin'

      - name: Get cluster credentials
        run: |
          gcloud container clusters get-credentials ${{ env.GKE_CLUSTER }} \
            --region ${{ env.GCP_REGION }} \
            --project ${{ env.GCP_PROJECT_ID }}

      - name: Install kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Update image tags
        run: |
          cd k8s/overlays/gcp
          for svc in $(ls ../../base); do
            kustomize edit set image "REPLACE_ME/$svc=${{ env.GAR_REGISTRY }}/$svc:${{ github.sha }}" 2>/dev/null || true
          done

      - name: Apply manifests
        run: |
          kustomize build k8s/overlays/gcp | kubectl apply -f -

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment --all -n maisys --timeout=10m

      - name: Smoke test
        run: |
          gateway_url=$(kubectl get svc api-gateway -n maisys -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          for i in {1..10}; do
            if curl -sf "http://$gateway_url/healthz"; then
              echo "Smoke test passed"
              exit 0
            fi
            sleep 6
          done
          echo "Smoke test failed"
          exit 1
