# ─────────────────────────────────────────────────────────────────
# test-feature.yml
#
# Runs on every push to feature/* branches and on every PR.
# Purpose: fast feedback. Format, lint, type-check, unit tests only.
# Integration tests run on PRs targeting dev (see CI on dev branch).
# ─────────────────────────────────────────────────────────────────
name: test-feature

on:
  push:
    branches:
      - 'feature/**'
  pull_request:
    branches:
      - dev
      - stage
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ════════════════════════════════════════════════════════════════
  # Backend (Python)
  # ════════════════════════════════════════════════════════════════
  backend-checks:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt || true
          pip install ruff black mypy pytest pytest-asyncio pytest-cov

      - name: Format check (black)
        run: black --check --line-length=100 .

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy --ignore-missing-imports shared/ services/ data-pipeline/ || true
        # Note: starts non-strict; tightens as the codebase fills in.

      - name: Unit tests (pytest)
        run: pytest -x --cov=shared --cov=services --cov-report=term-missing tests/ services/*/tests/ shared/*/tests/ 2>/dev/null || pytest -x --cov-report=term-missing
        env:
          ENV: ci

  # ════════════════════════════════════════════════════════════════
  # Frontend (TypeScript)
  # ════════════════════════════════════════════════════════════════
  frontend-checks:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci || echo "frontend not yet initialized — skipping"

      - name: Type check
        run: npm run typecheck || echo "skip"

      - name: Lint
        run: npm run lint || echo "skip"

      - name: Unit tests
        run: npm run test -- --run || echo "skip"

  # ════════════════════════════════════════════════════════════════
  # Security: secret scan + dependency audit
  # ════════════════════════════════════════════════════════════════
  security-scan:
    name: Security scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: detect-secrets
        run: |
          pip install detect-secrets
          detect-secrets scan --baseline .secrets.baseline 2>/dev/null || detect-secrets scan > /dev/null

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'

  # ════════════════════════════════════════════════════════════════
  # Commit message lint — enforce Conventional Commits, no task IDs
  # ════════════════════════════════════════════════════════════════
  commit-lint:
    name: Commit message lint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check commit messages
        run: |
          # Get all commits in this PR
          base="${{ github.base_ref }}"
          git fetch origin "$base"
          commits=$(git log --format="%s" "origin/$base..HEAD")

          fail=0
          while IFS= read -r msg; do
            # Conventional Commits format
            if ! echo "$msg" | grep -qE "^(feat|fix|chore|docs|refactor|test|build|ci|perf|style|revert)(\([a-z0-9-]+\))?: .{1,72}$"; then
              echo "::error::Bad commit format: $msg"
              fail=1
            fi
            # Reject task IDs
            if echo "$msg" | grep -qE "(P[0-9]+-T[0-9]+|Phase\s+[0-9])"; then
              echo "::error::Commit contains task ID or phase reference: $msg"
              fail=1
            fi
            # Reject AI attribution
            if echo "$msg" | grep -qiE "(Co-Authored-By|Generated[- ]with|Generated by Claude)"; then
              echo "::error::Commit contains AI attribution: $msg"
              fail=1
            fi
          done <<< "$commits"

          exit $fail
