# ─────────────────────────────────────────────────────────────────
# deploy-aws.yml
#
# Triggered on push to main branch. Production deployment.
#
# Requires manual approval before applying to EKS. Includes full
# integration + E2E tests + load tests before declaring success.
# ─────────────────────────────────────────────────────────────────
name: deploy-aws

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-aws
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER: maisys-prod
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com/maisys

jobs:
  detect-changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.changes.outputs.services }}
      frontend: ${{ steps.changes.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - id: changes
        run: |
          changed_services=$(git diff --name-only HEAD^ HEAD | grep -oE 'services/[^/]+' | sort -u | sed 's|services/||' | jq -R -s -c 'split("\n")[:-1]')
          echo "services=$changed_services" >> "$GITHUB_OUTPUT"

          if git diff --name-only HEAD^ HEAD | grep -q '^frontend/'; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
          fi

  build-services:
    name: Build ${{ matrix.service }}
    needs: detect-changes
    if: needs.detect-changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.services) }}
      fail-fast: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ matrix.service }}:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/${{ matrix.service }}:prod-latest
          cache-from: type=registry,ref=${{ env.ECR_REGISTRY }}/${{ matrix.service }}:cache
          cache-to: type=registry,ref=${{ env.ECR_REGISTRY }}/${{ matrix.service }}:cache,mode=max

  build-frontend:
    name: Build frontend
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/frontend:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/frontend:prod-latest

  # ════════════════════════════════════════════════════════════════
  # MANUAL APPROVAL GATE before applying to production
  # ════════════════════════════════════════════════════════════════
  approve-prod:
    name: Approve production deploy
    needs: [build-services, build-frontend]
    if: |
      always() &&
      (needs.build-services.result == 'success' || needs.build-services.result == 'skipped') &&
      (needs.build-frontend.result == 'success' || needs.build-frontend.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: production              # protected env — requires reviewer approval in GitHub settings
    steps:
      - name: Approval gate passed
        run: echo "Approved to deploy to production"

  deploy-k8s:
    name: Deploy to EKS prod
    needs: approve-prod
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name ${{ env.EKS_CLUSTER }} \
            --region ${{ env.AWS_REGION }}

      - name: Install kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Update image tags
        run: |
          cd k8s/overlays/aws
          for svc in $(ls ../../base); do
            kustomize edit set image "REPLACE_ME/$svc=${{ env.ECR_REGISTRY }}/$svc:${{ github.sha }}" 2>/dev/null || true
          done

      - name: Apply manifests (canary first)
        run: |
          kustomize build k8s/overlays/aws | kubectl apply -f -

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment --all -n maisys --timeout=20m

      - name: Production smoke test
        run: |
          for i in {1..20}; do
            if curl -sf "${{ secrets.PROD_API_BASE }}/healthz"; then
              echo "Prod smoke test passed"
              exit 0
            fi
            sleep 10
          done
          echo "Prod smoke test failed — initiating rollback"
          exit 1

      - name: Rollback on failure
        if: failure()
        run: |
          kubectl rollout undo deployment --all -n maisys

  prod-tests:
    name: Production verification suite
    needs: deploy-k8s
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run full E2E + load tests
        env:
          MAISYS_API_BASE: ${{ secrets.PROD_API_BASE }}
        run: |
          pip install pytest pytest-asyncio httpx locust
          pytest tests/integration/ -v
          # locust -f tests/load/locustfile.py --headless -u 50 -r 5 -t 5m --host ${{ secrets.PROD_API_BASE }} || true
