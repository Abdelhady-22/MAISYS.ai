# Alembic configuration for auth-service.
#
# At runtime, `sqlalchemy.url` is overridden by the DATABASE_URL environment
# variable (see alembic/env.py). The value below is only used as a safe
# default for tooling that doesn't set the env (e.g. `alembic revision
# --autogenerate` in local dev).

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
version_path_separator = os
sqlalchemy.url = sqlite+aiosqlite:///./alembic_default.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
