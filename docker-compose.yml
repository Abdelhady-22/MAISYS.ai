# ─────────────────────────────────────────────────────────────────
# MAISYS — Local development docker-compose
#
# Brings up infrastructure dependencies for local dev INSIDE a cloud VM.
# Service containers (auth, drug, etc.) are added per service as they're built.
# ─────────────────────────────────────────────────────────────────

services:
  # ════════════════════════════════════════════════════════════════
  # Postgres — one instance for local dev (production has per-service)
  # ════════════════════════════════════════════════════════════════
  postgres:
    image: postgres:16-alpine
    container_name: maisys-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-maisys}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_local_only}
      POSTGRES_MULTIPLE_DATABASES: auth,chatbot,drug,symptom,lab,research,export,notification,admin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres-init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-maisys}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ════════════════════════════════════════════════════════════════
  # Redis — cache, pub/sub, rate limiting
  # ════════════════════════════════════════════════════════════════
  redis:
    image: redis:7-alpine
    container_name: maisys-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ════════════════════════════════════════════════════════════════
  # Qdrant — vector DB for RAG
  # ════════════════════════════════════════════════════════════════
  qdrant:
    image: qdrant/qdrant:v1.12.0
    container_name: maisys-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ════════════════════════════════════════════════════════════════
  # RabbitMQ — async task queue
  # ════════════════════════════════════════════════════════════════
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: maisys-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ════════════════════════════════════════════════════════════════
  # MinIO — local S3-compatible storage for testing storage_client
  # (in production this is GCS/Azure/S3, never local)
  # ════════════════════════════════════════════════════════════════
  minio:
    image: minio/minio:latest
    container_name: maisys-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ════════════════════════════════════════════════════════════════
  # auth-migrate — one-shot Alembic runner for auth-service
  #
  # Runs `alembic upgrade head` against the auth database, then exits.
  # auth-service waits for this to complete before starting.
  # ════════════════════════════════════════════════════════════════
  auth-migrate:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    container_name: maisys-auth-migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-maisys}:${POSTGRES_PASSWORD:-changeme_local_only}@postgres:5432/auth
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  # ════════════════════════════════════════════════════════════════
  # auth-service — authentication and authorisation
  # ════════════════════════════════════════════════════════════════
  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    container_name: maisys-auth-service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-maisys}:${POSTGRES_PASSWORD:-changeme_local_only}@postgres:5432/auth
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-local-dev-jwt-secret-CHANGE-IN-STAGING-AND-PROD}
      JWT_ISSUER: ${JWT_ISSUER:-maisys}
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-30}
      OTP_EXPIRE_MINUTES: ${OTP_EXPIRE_MINUTES:-10}
      OTP_MAX_ATTEMPTS: ${OTP_MAX_ATTEMPTS:-3}
      LOGIN_MAX_FAILED_ATTEMPTS: ${LOGIN_MAX_FAILED_ATTEMPTS:-5}
      LOGIN_OTP_REQUIRED_ROLES: ${LOGIN_OTP_REQUIRED_ROLES:-admin,super_admin}
      PASSWORD_RESET_TTL_MINUTES: ${PASSWORD_RESET_TTL_MINUTES:-30}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_DEFAULT: ${RATE_LIMIT_DEFAULT:-100/minute}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      APPLE_OAUTH_CLIENT_ID: ${APPLE_OAUTH_CLIENT_ID:-}
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  rabbitmq_data:
  minio_data:

networks:
  default:
    name: maisys-network
